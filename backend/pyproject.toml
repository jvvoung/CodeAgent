[project]
name = "local-coding-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the Local Coding Agent"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.115,<0.137",
  "uvicorn[standard]>=0.30,<0.48",
  "httpx>=0.27,<0.29",
  "pydantic>=2.8,<2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
